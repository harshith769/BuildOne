name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # hashFiles() is not allowed in jobs.<id>.if, so a small job detects which parts exist yet.
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      frontend: ${{ steps.parts.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: parts
        run: |
          if [ -f backend/uv.lock ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f frontend/app/package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'   # active from M1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/buildone
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio-secret
      IDENTITY_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7
      - name: Start MinIO (S3 test double)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio-secret minio/minio server /data
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (Python version from backend/.python-version)
        working-directory: backend
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Types
        run: make typecheck
      - name: Import contracts
        run: make contracts
      - name: Tests (incl. tenancy suite, migrations, RLS/extension checks)
        run: make test
      - name: Rules
        run: make rules-validate eval-rules
      - name: Dependency audit
        run: make audit

  rules-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Validate example and published rules against the JSON Schema
        run: |
          shopt -s globstar nullglob
          files=(rules/examples/example_rule.yaml rules/published/**/*.yaml)
          uvx check-jsonschema --schemafile rules/schema/rule.schema.json "${files[@]}"

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'   # active from M1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/app/package.json   # version comes from "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml
      - run: pnpm --dir frontend/app install --frozen-lockfile
      - run: make frontend-check
      - uses: astral-sh/setup-uv@v10
        if: needs.detect.outputs.backend == 'true'
      - name: OpenAPI drift check
        if: needs.detect.outputs.backend == 'true'
        run: |
          cd backend && uv sync --frozen && cd ..
          make openapi
          git diff --exit-code frontend/app/src/api/

  secrets:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones; gitleaks-action needs both on PRs in a private repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required if the repo moves to a GitHub organisation (D-12).
