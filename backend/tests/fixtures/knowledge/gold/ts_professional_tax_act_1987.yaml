  unit: section
  format: html
  scope: all 37 sections
basis: 'Official HTML (tgct.gov.in): an index page that prints section numbers, and
  one page per section whose title is the heading. Section numbers are printed only
  in the index (and as "5-A:", "5-B:", "18-A:" for inserted sections); sub-section
  numbers exist only as <ol type=1> markup (rendered 1., 2., ...). s.23''s (a)/(b)
  list is a separate <ol type=a> (Explanation), not sub-sections. s.33''s second list
  item begins mid-sentence ("column / (2) of the Second Schedule"): kept as printed.
  Headings as printed on the section page, trailing colon dropped; 5-B has no printed
  heading. AP text as enacted, with insertion notes.'
