[project]
name = "buildone-backend"
version = "0.1.0"
description = "BuildOne API and worker"
requires-python = ">=3.14"
# Lower bounds only (latest on PyPI as of 2026-10-05); exact versions are locked in uv.lock (created in M1).
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.1",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "procrastinate>=3.10",
  "structlog>=26.1",
  "sentry-sdk[fastapi]>=2.71",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "tzdata>=2026.5",              # zoneinfo data for Asia/Kolkata on slim images
  "python-dateutil>=2.9",
  "icalendar>=7.3",
  "pgvector>=0.5",
  "boto3>=1.34",
  "sse-starlette>=3.5",
  # Adapters (imported only inside their adapter modules; see ADR-0011)
  "workos>=10.5",
  "groq>=1.7",
  "google-genai>=2.28",
  # Embedding runtime and parser are added after spikes S1/S2.
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "hypothesis>=6.168",
  "mypy>=2.4",
  "ruff>=0.16",
  "import-linter>=2.15",
  "pip-audit>=2.10",
  "types-PyYAML",
  "types-python-dateutil",
  "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF", "DTZ", "T20"]
# `ruff format` owns code line length; long docstrings and comments are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Migrations build DDL from constant schema names (never user input).
"migrations/**" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres", "tenancy: cross-tenant isolation"]

# Import contracts. Wildcards verified with import-linter 2.15 in M1. Adapter packages don't import their
# SDKs yet, so unmatched ignores are allowed until those adapters exist (M2, M5, M7).
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core compliance never depends on AI"
type = "forbidden"
source_modules = ["app.modules.rules", "app.modules.obligations", "app.modules.notifications"]
forbidden_modules = ["app.modules.ai"]

[[tool.importlinter.contracts]]
name = "AI provider SDKs only inside the AI adapters"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["groq", "google"]  # google-genai installs as the `google` namespace
ignore_imports = ["app.modules.ai.providers.** -> groq", "app.modules.ai.providers.** -> google"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Identity SDK only inside the identity adapter"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["workos"]
ignore_imports = ["app.modules.identity.providers.** -> workos"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "S3 SDK only inside the storage adapter"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["boto3", "botocore"]
ignore_imports = ["app.platform.storage.** -> boto3", "app.platform.storage.** -> botocore"]
unmatched_ignore_imports_alerting = "none"
