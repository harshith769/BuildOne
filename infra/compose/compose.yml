# Production topology (one-box). Local dev adds compose.dev.yml. See docs/deployment.md.
name: buildone

services:
  postgres:
    build: ../postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_API_PASSWORD: ${APP_API_PASSWORD}
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD}
      APP_INGEST_PASSWORD: ${APP_INGEST_PASSWORD}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX}
      AWS_ACCESS_KEY_ID: ${WALG_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${WALG_AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT: ${WALG_AWS_ENDPOINT}
      AWS_REGION: auto
      AWS_S3_FORCE_PATH_STYLE: "true"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=40
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker; mount the parent, not .../data.
      - pgdata:/var/lib/postgresql
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildone"]
      interval: 5s
      retries: 20
    mem_limit: 700m
    networks: [internal]

  api:
    image: ${BACKEND_IMAGE:-buildone-backend:local}
    build: ../../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_API}
      EMBEDDER_SOCKET: /run/embedder/embedder.sock
    volumes:
      - embedder-socket:/run/embedder
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 450m
    networks: [internal, edge]

  # Query-embedder sidecar (ADR-0014): holds bge-base-en-v1.5 int8 so the API process never loads a model.
  # Question text only, over a Unix socket; no network. S2: 269 MiB peak RSS, p95 21 ms at 2 threads.
  embedder:
    image: ${BACKEND_IMAGE:-buildone-backend:local}
    restart: unless-stopped
    command: ["python", "-m", "app.modules.knowledge.embedding.sidecar"]
    environment:
      EMBEDDER_SOCKET: /run/embedder/embedder.sock
      EMBEDDER_THREADS: "2"
      EMBEDDER_MODEL_DIR: /models
    volumes:
      - embedder-socket:/run/embedder
      - embedder-models:/models
    mem_limit: 300m
    network_mode: none  # never needs the network: the model files come from the embedder-models step

  # One-shot: download the pinned model files (SHA-256 checked) into the volume. `make dev` runs it.
  embedder-models:
    image: ${BACKEND_IMAGE:-buildone-backend:local}
    profiles: ["setup"]
    command: ["python", "-c", "from app.modules.knowledge.embedding.files import ensure_model_files; ensure_model_files()"]
    environment:
      EMBEDDER_MODEL_DIR: /models
    volumes:
      - embedder-models:/models
    networks: [edge]

  worker:
    image: ${BACKEND_IMAGE:-buildone-backend:local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_WORKER}
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 550m
    networks: [internal]

  migrate:
    image: ${BACKEND_IMAGE:-buildone-backend:local}
    profiles: ["migrate"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_OWNER}
    # Rule publication (`python -m app.modules.rules.publish`) is added to this command in M6.
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  caddy:
    image: caddy:2
    profiles: ["prod"]
    restart: unless-stopped
    ports: ["443:443"]
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/certs:/etc/caddy/certs:ro
    mem_limit: 50m
    networks: [edge]

volumes:
  pgdata:
  embedder-socket:
  embedder-models:

networks:
  internal:
    internal: true
  edge: {}
