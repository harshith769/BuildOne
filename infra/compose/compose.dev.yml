# Local development overrides: no WAL archiving, exposed ports, live reload, SeaweedFS for S3.
# (MinIO images were removed from Docker Hub in Sep 2026; any S3-API store works, ADR-0011.)
# The bind mount ../../backend:/app is safe because the image's virtualenv lives in /opt/venv.
services:
  postgres:
    command: ["postgres", "-c", "archive_mode=off", "-c", "max_connections=40"]
    # Host port is configurable: a Postgres installed directly on the machine often holds 5432.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    networks: [internal, edge]

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes: ["../../backend:/app:cached"]
    ports: ["127.0.0.1:8000:8000"]

  worker:
    volumes: ["../../backend:/app:cached"]

  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET_FILES}
    ports: ["127.0.0.1:9000:8333"]
    volumes: ["s3data:/data"]
    networks: [internal, edge]

volumes:
  s3data:
