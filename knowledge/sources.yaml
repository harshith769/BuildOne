# Official source registry — docs/data-pipeline.md §3. Only government sources; metadata only, never regulatory facts.
# A source comes from `download_url`, or by hand (`manual`: where to get it) into knowledge/inbox/<key>.<ext>
# (pdf, htm, or zip for an `html_bundle`: index.html plus one page per section). `bilingual` makes OCR use eng+hin;
# `scanned` marks image-only sources (every OCR'd page below confidence 93 waits for review, data-pipeline §7).
# Initial MVP set = the S1/S2 corpus (docs/spikes/S1-parsing.md). Gap sources are tracked in docs/status.md.
