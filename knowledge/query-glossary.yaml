# Query abbreviation and Hinglish glossary — ADR-0014, data-pipeline.md §6 step 0. Terminology only, never regulatory facts
# (no thresholds, rates, dates or forms). Expansion: the first occurrence of each abbreviation in a question gets
# its expansion appended in brackets ("TCS" -> "TCS (tax collected at source, collection of tax at source)").
# Matching is case-sensitive on whole words. Any change bumps `version` and needs before/after
# `make eval-retrieval` numbers in the PR (evaluation.md §4).
# v2 (M5.1): common Hinglish words founders use in compliance questions, expanded to the English the statutes use.
# A general list (most words appear in no labelled question); lowercase only, as typed mid-sentence.
version: 2
updated: 2026-10-07
